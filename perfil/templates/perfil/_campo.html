<div>
  <label for="{{ campo.id_for_label }}" class="etiqueta">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<p class="mt-1 text-xs text-slate-500">{{ campo.help_text }}</p>{% endif %}
  {% for e in campo.errors %}<p class="mt-1 text-xs text-red-600">{{ e }}</p>{% endfor %}
</div>

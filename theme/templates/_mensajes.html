{# Notificaciones (toasts) en lugar de alert() #}
{% if messages %}
<div class="fixed bottom-4 right-4 z-[60] space-y-2 w-[calc(100%-2rem)] max-w-sm" aria-live="polite">
  {% for message in messages %}
  <div x-data="{ v: true }" x-init="setTimeout(() => v = false, 5000)" x-show="v" x-transition
       class="flex items-start gap-3 p-4 rounded-xl shadow-lg border text-sm
              {% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950 dark:border-emerald-800 dark:text-emerald-200
              {% elif message.tags == 'error' %}bg-red-50 border-red-200 text-red-800 dark:bg-red-950 dark:border-red-800 dark:text-red-200
              {% else %}bg-white border-slate-200 text-slate-800 dark:bg-slate-900 dark:border-slate-700 dark:text-slate-200{% endif %}">
    <span class="flex-1">{{ message }}</span>
    <button type="button" @click="v = false" class="opacity-60 hover:opacity-100" aria-label="Cerrar">✕</button>
  </div>
  {% endfor %}
</div>
{% endif %}

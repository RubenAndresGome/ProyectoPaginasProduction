{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <!-- Card de Contacto -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 overflow-hidden">

        <!-- Encabezado -->
        <div class="bg-gradient-to-r from-emerald-500 to-teal-600 px-8 py-6">
            <h1 class="text-3xl font-extrabold text-white">
                📧 {{ title }}
            </h1>
            <p class="text-emerald-100 mt-2">Estamos aquí para ayudarte</p>
        </div>

        <!-- Contenido -->
        <div class="px-8 py-6">
            <div class="space-y-4">
                <div class="flex items-center gap-4 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg">
                    <div class="w-12 h-12 bg-emerald-100 dark:bg-emerald-900/30 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Email</p>
                        <p class="text-slate-800 dark:text-slate-200 font-medium">contacto@tudominio.com</p>
                    </div>
                </div>

                <div class="flex items-center gap-4 p-4 bg-slate-50 dark:bg-slate-800/50 rounded-lg">
                    <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Teléfono</p>
                        <p class="text-slate-800 dark:text-slate-200 font-medium">+52 55 1234 5678</p>
                    </div>
                </div>
            </div>

            <!-- Botón de Acción -->
            <div class="mt-6">
                <a href="mailto:contacto@tudominio.com" class="w-full block text-center px-6 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition-all duration-300 shadow-lg hover:shadow-emerald-500/30">
                    📩 Enviar Mensaje
                </a>
            </div>
        </div>

        <!-- Pie -->
        <div class="px-8 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700">
            <p class="text-sm text-slate-500 dark:text-slate-400 text-center">
                Tiempo de respuesta promedio: 24 horas
            </p>
        </div>
    </div>

    <!-- Botón Volver -->
    <div class="mt-6 text-center">
        <a href="{% url 'mainapp:inicio' %}" class="text-slate-500 dark:text-slate-400 hover:text-cyan-500 dark:hover:text-cyan-400 underline transition-colors">
            ← Volver al inicio
        </a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}
    Hola Mundo
{% endblock %}

{% block content %}
    <div class="max-w-2xl mx-auto mt-10 bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden border border-slate-200 dark:border-slate-700">

        <!-- Encabezado -->
        <div class="px-8 py-6 bg-cyan-50 dark:bg-cyan-900/30 border-b border-cyan-200 dark:border-cyan-800">
            <h1 class="text-3xl font-bold text-cyan-800 dark:text-cyan-300">Hola Mundo desde Django</h1>
            <p class="text-cyan-600 dark:text-cyan-100 mt-2">Tu primera página con Django + Tailwind</p>
        </div>

        <!-- Contenido -->
        <div class="px-8 py-6">
            <p class="text-lg text-slate-700 dark:text-slate-300 leading-relaxed">
                Hi desde DJANGO
            </p>

            <div class="mt-6 flex gap-4">
                <a href="{% url 'mainapp:inicio' %}" class="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-all duration-300 shadow-lg hover:shadow-cyan-500/30">
                    ← Volver al Inicio
                </a>
                <a href="{% url 'entrenador:inicio' %}" class="px-6 py-3 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 font-bold rounded-lg transition-all duration-300">
                    Ir a practicar →
                </a>
            </div>
        </div>

        <!-- Pie -->
        <div class="px-8 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700">
            <p class="text-sm text-slate-500 dark:text-slate-400">Este es un ejemplo de una página simple.</p>
        </div>

    </div>
{% endblock %}

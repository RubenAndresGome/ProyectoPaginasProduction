{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'theme/static/css/dist/styles.css' %}">
    <title>{% block title %}Django Site{% endblock %}</title>
</head>
<body>
    <header class="bg-gray-800 text-white shadow-lg">
        <nav class="container mx-auto px-4 py-3 flex items-center justify-between flex-wrap">
            <!-- Logo -->
            <a href="{% url 'inicio' %}" class="text-xl font-bold hover:text-yellow-300">DJANGO SITE | practicas</a>

            <!-- Botón móvil -->
            <button class="block md:hidden text-white focus:outline-none" onclick="toggleMenu()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Menú Desktop -->
            <ul id="menu" class="hidden md:flex w-full md:w-auto mt-4 md:mt-0 space-y-2 md:space-y-0 md:space-x-4">
                <li><a href="{% url 'inicio' %}" class="block hover:text-yellow-300">Inicio</a></li>
                <li><a href="{% url 'mainapp:hola_mundo' %}" class="block hover:text-yellow-300">Hola Mundo</a></li>
                <li><a href="{% url 'mainapp:Test' %}" class="block hover:text-yellow-300">Test</a></li>
                <li><a href="{% url 'mainapp:articulos_get' %}" class="block hover:text-yellow-300">Artículos</a></li>
                <li><a href="{% url 'mainapp:contacto' %}" class="block hover:text-yellow-300">Contacto</a></li>
                <li><a href="{% url 'blog:blog_publicaciones' %}" class="block px-3 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold rounded-lg transition-all">Blog</a></li>
                <li class="text-gray-500">|</li>
                    <li><a href="{% url 'login_and_reg:login' %}" class="block hover:text-yellow-300">Login</a></li>
                    <li><a href="{% url 'login_and_reg:register' %}" class="block px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold rounded-lg transition-all">Registro</a></li>

            </ul>
        </nav>
    </header>

    <section id="contenido" class="container mx-auto px-4 py-6">
        {% block contenido %}{% endblock %}
    </section>

    <footer class="bg-gray-800 text-gray-300 py-6 mt-10">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm">&copy; 2026 Django Site - Ruben GM</p>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>

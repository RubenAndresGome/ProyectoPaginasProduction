{% load static %}
<header class="bg-slate-900 dark:bg-slate-800 border-b border-slate-700 dark:border-slate-600 sticky top-0 z-50">
    <nav class="container mx-auto px-4 py-3">
        <div class="flex items-center justify-between flex-wrap">

            <!-- Logo -->
            <a href="/" class="flex items-center space-x-3 hover:opacity-80 transition-opacity">
                <img src="{% static 'images/logoDJANGO.png' %}" alt="Logo" class="w-10 h-10 object-contain">
                <span class="text-xl font-bold text-white">Mi Sitio</span>
            </a>

            <!-- Menú Escritorio -->
            <ul class="hidden md:flex items-center space-x-6">
                <li><a href="{% url 'inicio' %}" class="text-slate-300 hover:text-cyan-400 transition-colors font-medium">Inicio</a></li>
                <li><a href="{% url 'hola_mundo' %}" class="text-slate-300 hover:text-cyan-400 transition-colors font-medium">Hola Mundo</a></li>
                <li><a href="{% url 'Test' %}" class="text-slate-300 hover:text-cyan-400 transition-colors font-medium">Test</a></li>
                <li><a href="{% url 'articulos_get' %}" class="text-slate-300 hover:text-cyan-400 transition-colors font-medium">Artículos</a></li>
                <li><a href="{% url 'contacto' %}" class="text-slate-300 hover:text-cyan-400 transition-colors font-medium">Contacto</a></li>
                <li><a href="{% url 'blog:blog_publicaciones' %}" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-sm font-bold rounded-lg transition-all">Blog</a></li>
            </ul>

            <div class="flex items-center space-x-4">
                <!-- Mini Buscador Rápido Unificado -->
                <form action="{% url 'articulos_unificados' %}" method="GET" class="hidden lg:flex items-center">
                    <div class="relative">
                        <input type="text" name="q" placeholder="Buscar general..." 
                            class="w-48 pl-4 pr-10 py-1.5 text-sm bg-slate-800 border border-slate-600 rounded-full text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
                        <button type="submit" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-cyan-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </button>
                    </div>
                </form>

                <!-- Botón Dark Mode -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-700 dark:bg-slate-600 text-yellow-400 hover:bg-slate-600 dark:hover:bg-slate-500 transition-all">
                    <!-- SVGs omitidos por brevedad -->
                    <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </nav>
</header>

<script>
    function toggleDarkMode() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.theme = 'light';
        } else {
            document.documentElement.classList.add('dark');
            localStorage.theme = 'dark';
        }
    }
</script>

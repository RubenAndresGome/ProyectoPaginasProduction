<a href="{{ bloque.datos.url }}" target="_blank" rel="noopener noreferrer" class="my-6 flex items-center gap-4 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:border-purple-500 transition-colors">
    <span class="text-2xl">🔗</span>
    <span>
        <span class="block font-bold text-purple-600 dark:text-purple-400">{{ bloque.datos.texto|default:bloque.datos.url }}</span>
        {% if bloque.datos.descripcion %}<span class="block text-sm text-slate-500 dark:text-slate-400">{{ bloque.datos.descripcion }}</span>{% endif %}
    </span>
</a>

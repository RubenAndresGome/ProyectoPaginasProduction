<div class="mb-8 p-6 bg-slate-800 rounded-xl border border-slate-700">
    <form method="get" action="{% url 'blog:blog_publicaciones' %}" class="flex flex-col md:flex-row gap-4 items-center">

        <!-- Barra de Búsqueda -->
        <div class="flex-grow w-full md:w-auto">
            <input
                type="text"
                name="q"
                placeholder="Buscar por título..."
                class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-orange-500"
                value="{{ request.GET.q }}"
            >
        </div>

        <!-- Filtro de Categorías -->
        <div class="w-full md:w-auto">
            <select name="cat" class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                <option value="">Todas las categorías</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}" {% if request.GET.cat == categoria.id|stringformat:"s" %}selected{% endif %}>
                        {{ categoria.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Botón de Envío -->
        <div>
            <button type="submit" class="w-full px-6 py-2 bg-orange-600 text-white font-bold rounded-lg hover:bg-orange-500 transition-colors">
                Filtrar
            </button>
        </div>

    </form>
</div>
